plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.77'
    id 'maven-publish'
}

// Mixin refmap + config registration (the legacyforge plugin applies the Sponge mixin plugin).
mixin {
    add sourceSets.main, "me.refmap.json"
    config "me.mixins.json"
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "1.20.1-47.4.20"
    accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]

    runs {
        client { client() }
        server { server() }
        data { data() }
    }
    mods {
        "me" {
            sourceSet sourceSets.main
        }
    }
}

// The REI plugin sources (Fabric-only API) are excluded until the JEI port lands (milestone M7).
sourceSets.main.java.exclude 'net/jukoz/me/compat/ModREIClientPlugin.java'
sourceSets.main.java.exclude 'net/jukoz/me/compat/REIClientPluginME.java'
sourceSets.main.java.exclude 'net/jukoz/me/compat/REICommonPluginME.java'
sourceSets.main.java.exclude 'net/jukoz/me/compat/alloyFurnace/**'
sourceSets.main.java.exclude 'net/jukoz/me/compat/artisanTable/**'
sourceSets.main.java.exclude 'net/jukoz/me/compat/forge/**'
// Datagen providers compile against FFAPI's fabric-data-generation-api-v1 (Fabric API surface).


processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_license: project.mod_license,
                mod_authors: project.mod_authors,
                mod_description: project.mod_description
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // Keep the whole error list visible while the port is red.
    options.fork = true
    options.forkOptions.memoryMaximumSize = '3g'
    options.compilerArgs += ['-Xmaxerrs', '60000']
}

repositories {
    mavenCentral()
    maven {
        name = "Sinytra"
        url = "https://maven.su5ed.dev/releases"
    }
}

// Forgified Fabric API: the Fabric API surface, implemented for Forge. Used as the
// compile-time API; see FORGE_PORT.md for the runtime (shim) story.
dependencies {
    compileOnly group: "dev.su5ed.sinytra.fabric-api", name: "fabric-api", version: "0.92.6+1.11.15+1.20.1"
}
