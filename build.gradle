plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

    // Rosetta remote debug bridge: compiles and runs Java inside the dev server on the
    // server thread, over a local TCP control plane. Dev-only, never shipped.
    modRuntimeOnly files('libs/rosetta_remote_debug_bridge-1.0.0-fabric.jar')

    // 0.4.1 declares `depends: minecraft >=1.21.6` in its fabric.mod.json, so Fabric
    // Loader refuses to start it on 1.20.1. 0.3.3 has no minecraft version constraint
    // and the same Permissions API. Both POMs import a 1.21.x Fabric API BOM as a strict
    // platform; exclude it so the 1.20.1 Fabric API isn't dragged up (which would leak
    // 1.21 injected interfaces into the remapped jar).
    modImplementation("me.lucko:fabric-permissions-api:0.3.3") {
        exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api-bom'
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

processResources {
    // src/main/resources is listed before src/main/generated, so EXCLUDE lets the handful of
    // hand-written datapack files (e.g. data/me/loot_tables/blocks/maple_leaves.json) win over
    // the datagen output instead of failing the build on a duplicate entry.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

loom {
    accessWidenerPath = file("src/main/resources/me.accesswidener")
    runs {
        client {
            // The bridge only listens once a world is joined, so automated client runs
            // quick-play straight into one.
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlay')
            }
            vmArg '-Drosetta.remote.port=48797'
        }
        server {
            vmArg '-Drosetta.remote.port=48798'
        }
        datagenClient {
            inherit client
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/main/generated')}"
            vmArg "-Dfabric-api.datagen.modid=${modid}"
            runDir 'build/datagen'
        }
    }
}

sourceSets.main.resources.srcDirs += ['src/main/generated']

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    // During the 1.21 -> 1.20.1 port the tree is deliberately red; javac's default
    // 100-error cap hides almost all of the worklist, so raise it.
    options.compilerArgs += ['-Xmaxerrs', '60000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {}
}

// FabricDynamicRegistryProvider folds the registry's namespace into the output directory, so the
// mod's own dynamic registries (me:race, me:spider_variants, ...) land in data/me/me/<registry>/
// while vanilla-keyed ones (minecraft:worldgen/biome, ...) land in data/me/<registry>/. Datapack
// loading looks for data/<registry namespace>/<registry path>/, so the stray level has to go.
tasks.matching { it.name == 'runDatagen' }.configureEach {
    doLast {
        def stray = file('src/main/generated/data/me/me')
        if (stray.isDirectory()) {
            stray.listFiles().each { entry ->
                def target = file("src/main/generated/data/me/${entry.name}")
                if (target.exists()) {
                    target.deleteDir()
                }
                if (!entry.renameTo(target)) {
                    target.mkdirs()
                    entry.eachFileRecurse { f ->
                        def rel = entry.toPath().relativize(f.toPath()).toString()
                        def out = new File(target, rel)
                        if (f.isDirectory()) {
                            out.mkdirs()
                        } else {
                            out.parentFile.mkdirs()
                            out.bytes = f.bytes
                        }
                    }
                    entry.deleteDir()
                }
            }
            stray.deleteDir()
        }
    }
}
