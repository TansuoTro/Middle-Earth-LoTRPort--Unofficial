plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

    // Rosetta remote debug bridge: compiles and runs Java inside the dev server on the
    // server thread, over a local TCP control plane. Dev-only, never shipped.
    modRuntimeOnly files('libs/rosetta_remote_debug_bridge-1.0.0-fabric.jar')

    modImplementation "me.lucko:fabric-permissions-api:0.4.1"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

loom {
    accessWidenerPath = file("src/main/resources/me.accesswidener")
    runs {
        client {
            // The bridge only listens once a world is joined, so automated client runs
            // quick-play straight into one.
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlay')
            }
            vmArg '-Drosetta.remote.port=48797'
        }
        server {
            vmArg '-Drosetta.remote.port=48798'
        }
        datagenClient {
            inherit client
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/main/generated')}"
            vmArg "-Dfabric-api.datagen.modid=${modid}"
            runDir 'build/datagen'
        }
    }
}

sourceSets.main.resources.srcDirs += ['src/main/generated']

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    // During the 1.21 -> 1.20.1 port the tree is deliberately red; javac's default
    // 100-error cap hides almost all of the worklist, so raise it.
    options.compilerArgs += ['-Xmaxerrs', '60000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {}
}
