# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true

# Network: maven.minecraftforge.net / maven.neoforged.net are only reachable through the local proxy
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.net.minecraftforge.gradle.check.certs=false

# Forge / Minecraft 1.20.1
minecraft_version=1.20.1
forge_version=47.4.20

# Mod
mod_id=me
mod_name=Middle-earth
mod_license=ARR
mod_authors=Jukoz, ObliviousCrab
mod_description=Join the legendary world of Tolkien's universe from The Lord of The Rings to the Hobbit and more!
mod_version=1.4.2-1.20.1-port.0
maven_group=net.jukoz
archives_base_name=Middle-earth
